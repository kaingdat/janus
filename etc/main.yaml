# Janus boot configuration.
#
# This single file is read by two independent consumers:
#   * the Pingora server framework reads its server-level settings (below);
#   * Janus's MainConfig reads the application-level settings (further down).

# --- Pingora server settings -------------------------------------------------
version: 1
# How many worker threads each service gets (threads are not shared).
threads: 2
# Process ID file written when running in the background (--daemon).
pid_file: /tmp/janus.pid
# Socket used to coordinate zero-downtime upgrades (--upgrade).
upgrade_sock: /tmp/janus_upgrade.sock
# Keepalive pool size for upstream connections.
upstream_keepalive_pool_size: 128

# --- Janus application settings ----------------------------------------------
# Address the plaintext HTTP proxy listens on.
proxy_address_http: 0.0.0.0:6193
# Path to upstreams config
upstreams_conf: etc/upstreams.yaml
# Max log level: info | warn | error | debug | trace | off
log_level: info
# Uncomment to write logs to a file instead of stdout.
# log_file: /tmp/janus.log
