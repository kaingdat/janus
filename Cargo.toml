[package]
name = "janus"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
correctness = "deny"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
pingora = { version = "0.8.1", features = ["lb", "proxy", "openssl"] }
